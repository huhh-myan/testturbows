name: "Deploy embed script"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pipeline
        run: echo "hi"
      - name: Donot know
        run: echo "CHECKING PUSH AGAIN"
      - name: saving private key to SERVER and changing permission
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key
      - name: Adding server to known hosts
        run: |
          ls ~/.ssh
          ssh-keyscan -H 52.64.188.144 >> ~/.ssh/known_hosts
      - name: Check key format
        run: |
          head -n 1 ~/.ssh/ssh_key
          tail -n 1 ~/.ssh/ssh_key
          ssh-keygen -y -f ~/.ssh/ssh_key > /dev/null
      - name: sshing to server
        run: |
          ssh -i ~/.ssh/ssh_key ubuntu@52.64.188.144 "
            whoami
            echo PATH=\$PATH
            which node 
            which pnpm 
            source ~/.bashrc
            which node || true
            which pnpm || true
            pnpm --version
            "
name: "Deploy embed script"

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pipeline
        run: echo "hi"
      - name: Donot know
        run: echo "CHECKING PUSH AGAIN"
      - name: saving private key to SERVER and changing permission
        run: |
          echo "${{ secrets.SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
      - name: Adding server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 52.64.144.188 >> ~/.ssh/known_hosts
      - name: sshing to server
        run: ssh -i ~/ssh_key ubuntu@52.64.188.144 "ls"